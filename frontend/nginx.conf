# Service des fichiers produits par Vite, et relais des appels d'API.
#
# L'interface et l'API sont servies sous la même origine : le navigateur ne voit qu'un
# seul hôte, comme en développement derrière le serveur de Vite. Aucune adresse d'API
# n'a donc à être injectée dans les fichiers compilés, et la question du partage entre
# origines ne se pose pas.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Politique de sécurité du contenu.
    #
    # Elle est posée ici et non par un intergiciel de l'API : la surface d'injection est
    # la page, servie par ce serveur, et l'API ne rend que du JSON. Une politique
    # appliquée aux réponses de l'API ne protégerait pas le document.
    #
    #   script-src 'self'        aucun script en ligne : la compilation de Vite ne
    #                            produit que des fichiers externes, et c'est de cette
    #                            directive que vient l'essentiel de la protection ;
    #   style-src sans 'unsafe-inline'  — corrigé après mesure au navigateur, contre la
    #                            supposition inverse retenue jusque-là. On croyait que
    #                            la bibliothèque de tracé exigeait cette tolérance : le
    #                            document rendu ne contient aucune balise <style>, et
    #                            les cinq styles en ligne qu'elle pose passent par le
    #                            modèle objet du document, que la politique ne gouverne
    #                            pas. Retirer la tolérance ne change donc rien au rendu,
    #                            et rend inertes une balise <style> injectée comme un
    #                            attribut style posé par un script tiers — mesuré :
    #                            les deux lèvent bien une violation ;
    #   fonts.googleapis.com     la feuille de la police Inter, et fonts.gstatic.com les
    #                            fichiers de police eux-mêmes. Les deux origines
    #                            disparaîtront de la politique le jour où la police sera
    #                            auto-hébergée ;
    #   connect-src 'self'       l'API est servie sous la même origine, aucune autre
    #                            destination n'a à être joignable depuis la page ;
    #   frame-ancestors 'none'   double X-Frame-Options, qui reste pour les navigateurs
    #                            anciens ;
    #   base-uri, form-action    ferment deux détournements que script-src ne couvre pas.
    set $politique_csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # L'application n'est jamais destinée à être affichée dans un cadre tiers, et le
    # type déclaré d'une ressource ne doit pas être réinterprété par le navigateur.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $politique_csp always;

    location /api/ {
        # Un nom d'hôte écrit directement dans proxy_pass n'est résolu qu'une fois, au
        # démarrage de Nginx. Si le conteneur de l'API est recréé seul et change
        # d'adresse, le relais continue de pointer vers l'ancienne jusqu'au
        # redémarrage de celui-ci. Le passer par une variable impose une résolution à
        # chaque requête, auprès du résolveur interne de Docker, avec dix secondes de
        # cache.
        resolver 127.0.0.11 valid=10s;
        set $amont http://api:5000;
        proxy_pass $amont;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Attention : un bloc qui pose son propre add_header n'hérite plus de ceux du niveau
    # supérieur. Les trois en-têtes ci-dessus sont donc répétés dans les deux blocs qui
    # ajoutent une directive de cache, faute de quoi le document principal les perdrait.

    # Vite appose une empreinte du contenu dans le nom de chaque fichier produit :
    # ceux-ci ne changent jamais sans changer de nom, ils peuvent donc être conservés
    # indéfiniment par le navigateur.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $politique_csp always;
    }

    # Le document qui référence ces fichiers, lui, change à chaque livraison.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $politique_csp always;
    }

    # Aucun limit_req n'est posé, et c'est un choix mesuré plutôt qu'un oubli. Le relevé
    # du 05/09 montre que $remote_addr vaut la passerelle Docker pour tout client venant
    # du port publié : un plafond par adresse y compterait le monde entier sur un
    # compteur unique, et le premier utilisateur à l'épuiser fermerait le service aux
    # autres. La limitation est donc portée par l'API, où l'adresse électronique soumise
    # distingue réellement les clients.

    # Application à page unique : le routage est fait dans le navigateur. Une adresse
    # inconnue du serveur n'est donc pas une erreur, elle rend le document principal.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
