# Service des fichiers produits par Vite, et relais des appels d'API.
#
# L'interface et l'API sont servies sous la même origine : le navigateur ne voit qu'un
# seul hôte, comme en développement derrière le serveur de Vite. Aucune adresse d'API
# n'a donc à être injectée dans les fichiers compilés, et la question du partage entre
# origines ne se pose pas.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # L'application n'est jamais destinée à être affichée dans un cadre tiers, et le
    # type déclaré d'une ressource ne doit pas être réinterprété par le navigateur.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # Un nom d'hôte écrit directement dans proxy_pass n'est résolu qu'une fois, au
        # démarrage de Nginx. Si le conteneur de l'API est recréé seul et change
        # d'adresse, le relais continue de pointer vers l'ancienne jusqu'au
        # redémarrage de celui-ci. Le passer par une variable impose une résolution à
        # chaque requête, auprès du résolveur interne de Docker, avec dix secondes de
        # cache.
        resolver 127.0.0.11 valid=10s;
        set $amont http://api:5000;
        proxy_pass $amont;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Attention : un bloc qui pose son propre add_header n'hérite plus de ceux du niveau
    # supérieur. Les trois en-têtes ci-dessus sont donc répétés dans les deux blocs qui
    # ajoutent une directive de cache, faute de quoi le document principal les perdrait.

    # Vite appose une empreinte du contenu dans le nom de chaque fichier produit :
    # ceux-ci ne changent jamais sans changer de nom, ils peuvent donc être conservés
    # indéfiniment par le navigateur.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Le document qui référence ces fichiers, lui, change à chaque livraison.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Application à page unique : le routage est fait dans le navigateur. Une adresse
    # inconnue du serveur n'est donc pas une erreur, elle rend le document principal.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
