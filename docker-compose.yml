# Environnement de développement : base de données et cache uniquement.
# Le front et l'API tournent sur le poste (npm run dev) et se connectent à ces deux
# services. La mise en conteneurs des images applicatives relève du déploiement et
# sera traitée avec les Dockerfile. La pile complète vit dans
# docker-compose.production.yml, sous un autre nom de projet : les deux cohabitent sans
# partager ni conteneurs ni volume.
#
# Le nom de projet est fixé explicitement plutôt que déduit du nom du dossier, qui
# varierait d'un poste à l'autre : les conteneurs et le volume gardent le même nom
# quel que soit l'emplacement du dépôt.

name: capitall

services:
  db:
    image: postgres:16-alpine
    container_name: capitall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capitall-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    # Volontairement sans volume : le cache est jetable. Le perdre n'a aucune
    # conséquence fonctionnelle, les cours sont simplement récupérés à nouveau
    # auprès des fournisseurs au prochain appel.

volumes:
  donnees-postgres:
