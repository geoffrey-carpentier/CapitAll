# Pile complète de CapitAll : interface, API, base de données et cache, tous en conteneur.
#
# Distinct de docker-compose.yml, qui ne monte que les deux services d'infrastructure
# dont le développement a besoin, l'API et l'interface tournant alors sur le poste.
# Ici, rien n'est installé sur la machine hôte : Docker suffit à faire tourner
# l'application.
#
#   docker compose -f docker-compose.production.yml up -d --build
#
# Les deux piles portent des noms de projet différents. Elles peuvent donc cohabiter,
# avec leurs propres conteneurs et leur propre volume de données : démarrer celle-ci
# ne touche jamais la base de développement.

name: capitall-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # schema.sql accorde les droits sur la base nommée capitall : ce nom ne doit pas
      # être changé sans adapter le script.
      POSTGRES_DB: ${POSTGRES_DB}
      CAPITALL_APP_PASSWORD: ${CAPITALL_APP_PASSWORD}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
      # Ces trois scripts ne sont joués qu'à la création du volume, jamais à un
      # redémarrage : une pile relancée retrouve ses données au lieu de les écraser.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/db/docker/03-role-applicatif.sh:/docker-entrypoint-initdb.d/03-role-applicatif.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Aucun port publié : la base n'est joignable que depuis le réseau interne de la pile.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sans volume, comme en développement : le cache est jetable, le perdre n'a aucune
    # conséquence fonctionnelle. Sans port publié non plus.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # L'API se connecte avec le rôle applicatif, limité à la lecture et à l'écriture
      # des données. Les hôtes sont les noms des services : Docker les résout sur le
      # réseau interne de la pile.
      DATABASE_URL: postgresql://capitall_app:${CAPITALL_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2h}
      ORIGINE_AUTORISEE: ${ORIGINE_AUTORISEE:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aucun port publié : l'API n'est atteinte que par le relais de l'interface.

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '${PORT_APPLICATION:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  donnees-postgres:
